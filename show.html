<!DOCTYPE html>
<html>
<head>
    <title>Laboratory Inventory Records</title>

    <style>
        body {
            background-color: #bce2ee;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .header {
            background-color: blue;
            color: white;
            padding: 12px;
            font-size: 24px;
            font-weight: bold;
            font-family: "Times New Roman", Times, serif;
            margin-top: 8px;
        }

        table {
            margin: 25px auto;
            background-color: white;
            border-collapse: collapse;
            width: 90%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #d3d3d3;
        }

        .btn-back {
            background-color: blue;
            color: white;
            padding: 9px 18px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        LABORATORY INVENTORY RECORDS
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>ITEM NAME</th>
            <th>CATEGORY</th>
            <th>QUANTITY</th>
            <th>UNIT</th>
            <th>LABORATORY</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
        </tr>
        {% endfor %}

        {% if not data %}
        <tr>
            <td colspan="6">No inventory records found.</td>
        </tr>
        {% endif %}
    </table>

    <br>

    <a href="/" class="btn-back">GO BACK</a>

</body>
</html>
