<!DOCTYPE html><html>
<head>
    <title>Update Laboratory Item</title>
    <style>
        body {
            background-color: #bce2ee;
            font-family: Arial, sans-serif;
            text-align: center;
        }    h2 {
        background-color: blue;
        color: white;
        padding: 15px;
    }

    form {
        background-color: #d3d3d3;
        width: 350px;
        margin: 30px auto;
        padding: 20px;
    }

    input, select {
        width: 90%;
        padding: 8px;
        margin: 8px;
    }

    button {
        background-color: green;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
    }
</style>

</head>
<body><h2>UPDATE LABORATORY ITEM</h2>

<form action="/update/{{ item[0] }}" method="POST">

    <input type="text" name="name"
           value="{{ item[1] }}" required>

    <select name="category" required>
        <option value="Equipment"
            {% if item[2] == 'Equipment' %}selected{% endif %}>
            Equipment
        </option>
        <option value="Consumable"
            {% if item[2] == 'Consumable' %}selected{% endif %}>
            Consumable
        </option>
    </select>

    <input type="number" name="quantity"
           value="{{ item[3] }}" min="0" required>

    <select name="unit" required>
        {% for u in ['Pieces', 'Boxes', 'Bottles', 'Litres', 'Packets', 'Kg'] %}
        <option value="{{ u }}"
            {% if item[4] == u %}selected{% endif %}>
            {{ u }}
        </option>
        {% endfor %}
    </select>

    <input type="text" name="lab"
           value="{{ item[5] }}" required>

    <button type="submit">UPDATE ITEM</button>

</form>

<a href="/show">Back to Inventory</a>

</body>
</html>
