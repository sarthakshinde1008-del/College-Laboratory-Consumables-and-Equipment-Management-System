<!DOCTYPE html><html>
<head>
    <title>Search Laboratory Items</title>
    <style>
        body {
            background-color: #bce2ee;
            font-family: Arial, sans-serif;
            text-align: center;
        }    h2 {
        background-color: blue;
        color: white;
        padding: 15px;
    }

    form {
        margin: 25px;
    }

    input, select {
        padding: 10px;
        margin: 5px;
    }

    button {
        background-color: green;
        color: white;
        padding: 10px 18px;
        border: none;
        cursor: pointer;
    }

    table {
        margin: 25px auto;
        border-collapse: collapse;
        background-color: white;
        width: 90%;
    }

    th, td {
        border: 1px solid black;
        padding: 10px;
    }

    th {
        background-color: #d3d3d3;
    }
</style>

</head>
<body><h2>SEARCH LABORATORY INVENTORY</h2>

<form action="/search" method="GET">

    <input type="text" name="keyword"
           placeholder="Enter item name or category"
           value="{{ keyword }}" required>

    <button type="submit">SEARCH</button>

</form>

<table>
    <tr>
        <th>ID</th>
        <th>Item Name</th>
        <th>Category</th>
        <th>Quantity</th>
        <th>Unit</th>
        <th>Laboratory</th>
    </tr>

    {% for row in data %}
    <tr>
        {% for value in row %}
        <td>{{ value }}</td>
        {% endfor %}
    </tr>
    {% else %}
    <tr>
        <td colspan="6">No matching items found.</td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="/">Back to Home</a>
<br><br>
<a href="/show">View All Inventory</a>

</body>
</html>
